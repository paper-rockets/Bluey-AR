<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crew Remote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#08080c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;user-select:none}
body{padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;font-weight:700;letter-spacing:.04em}
#link{display:flex;align-items:center;gap:7px;font-size:11px;color:#6f7784}
#link .dot{width:8px;height:8px;border-radius:50%;background:#e5484d;transition:background .3s}
#link .dot.on{background:#46c46a}

section{display:flex;flex-direction:column;gap:10px}
h2{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5f6672}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

button{font-family:inherit;font-size:15px;font-weight:600;color:#e8ebf0;background:#15161c;border:1px solid #24262f;border-radius:14px;padding:20px 12px;cursor:pointer;transition:transform .1s,background .15s,border-color .15s}
button:active{transform:scale(.95);background:#1e202a}
button.sel{background:#fff;color:#000;border-color:#fff}
button.wide{padding:26px 12px;font-size:17px}
button .sub{display:block;margin-top:5px;font-size:11px;font-weight:500;opacity:.55}
button:disabled{opacity:.35;cursor:default}

#vol{width:100%;accent-color:#fff;height:34px}
.row{display:flex;gap:10px}
#roomIn{flex:1;min-width:0;background:#15161c;border:1px solid #24262f;border-radius:14px;color:#fff;
  font-family:inherit;font-size:19px;font-weight:700;letter-spacing:.22em;text-align:center;padding:16px 12px}
#roomBtn{padding:16px 26px}
.hint{font-size:11px;color:#5f6672}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:#fff;color:#000;font-size:13px;font-weight:600;padding:10px 20px;border-radius:11px;opacity:0;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <h1>CREW REMOTE</h1>
  <div id="link"><span class="dot" id="linkDot"></span><span id="linkTxt">connecting…</span></div>
</header>

<section>
  <h2>Who's on screen</h2>
  <div class="grid g3">
    <button class="view sel" data-view="all">All<span class="sub">4 characters</span></button>
    <button class="view" data-view="bluey">Bluey<span class="sub">+ Bingo</span></button>
    <button class="view" data-view="kuromi">Kuromi<span class="sub">+ Purin</span></button>
  </div>
</section>

<section>
  <h2>Music</h2>
  <div class="grid g3">
    <button data-music="prev">&#9664;&#9664;</button>
    <button data-music="toggle" class="wide" id="playBtn">&#9654;<span class="sub">play / pause</span></button>
    <button data-music="next">&#9654;&#9654;</button>
  </div>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.65">
</section>

<section>
  <h2>Make them react</h2>
  <div class="grid g3">
    <button data-gesture="wave">Wave</button>
    <button data-gesture="cheer">Cheer</button>
    <button data-gesture="dance">Dance</button>
  </div>
</section>

<section id="roomRow" style="display:none">
  <h2>Room code</h2>
  <div class="row">
    <input id="roomIn" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCDE">
    <button id="roomBtn">Join</button>
  </div>
  <p class="hint">Must match the code shown on the display.</p>
</section>

<div id="toast"></div>

<script type="module">
import { openChannel, resolveRoom } from './relay.js';

const linkDot = document.getElementById('linkDot');
const linkTxt = document.getElementById('linkTxt');
const toastEl = document.getElementById('toast');
let channel = null;
let online = false;

function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._to);
    toastEl._to = setTimeout(() => toastEl.classList.remove('show'), 1300);
}

function setLink(ok, text) {
    online = ok;
    linkDot.classList.toggle('on', ok);
    linkTxt.textContent = text;
}

async function send(cmd, label) {
    try {
        if (!channel) throw new Error('not ready');
        await channel.send(cmd);
        if (label) toast(label);
        if (navigator.vibrate) navigator.vibrate(12);
    } catch {
        setLink(false, 'no connection');
        toast('not connected');
    }
}

document.querySelectorAll('.view').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.view').forEach(x => x.classList.toggle('sel', x === b));
    send({ type: 'view', view: b.dataset.view },
         { all: 'All 4', bluey: 'Bluey & Bingo', kuromi: 'Kuromi & Purin' }[b.dataset.view]);
}));

document.querySelectorAll('[data-music]').forEach(b => b.addEventListener('click', () => {
    const action = b.dataset.music;
    send({ type: 'music', action }, { toggle: 'play / pause', next: 'next track', prev: 'previous track' }[action]);
}));

document.querySelectorAll('[data-gesture]').forEach(b => b.addEventListener('click', () => {
    send({ type: 'gesture', kind: b.dataset.gesture }, b.textContent + '!');
}));

// Throttle the slider so dragging doesn't fire a request per pixel.
let volTimer = null;
document.getElementById('vol').addEventListener('input', e => {
    const value = +e.target.value;
    clearTimeout(volTimer);
    volTimer = setTimeout(() => send({ type: 'volume', value }), 120);
});

// On a static host the room code has to match the display's. It normally
// arrives in the URL hash; this is the fallback for typing it by hand.
document.getElementById('roomBtn').addEventListener('click', () => {
    const code = (document.getElementById('roomIn').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{4,8}$/.test(code)) return toast('4-8 letters/numbers');
    location.hash = code;
    location.reload();
});

async function connect() {
    setLink(false, 'connecting…');
    try {
        channel = await openChannel({ onStatus: ok => setLink(ok, ok ? 'connected' : 'reconnecting…') });
        const roomRow = document.getElementById('roomRow');
        if (channel.mode === 'cloud') {
            roomRow.style.display = 'flex';
            document.getElementById('roomIn').value = channel.room;
            setLink(false, `room ${channel.room} — connecting…`);
        } else {
            roomRow.style.display = 'none';
            setLink(true, 'connected (local)');
        }
    } catch (e) {
        setLink(false, 'no connection');
        toast('could not connect');
    }
}
connect();
</script>
</body>
</html>
